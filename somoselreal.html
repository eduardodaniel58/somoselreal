<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Botones Azules</title>
  <style>
    /* Cabecera con botones */
    .header {
      grid-column: 1 / 3;
      display: flex;
      justify-content: flex-start; /* botones alineados a la izquierda */
      align-items: center;
      margin-bottom: 10px;
      gap: 10px; /* separación uniforme entre botones */
    }

    /* Botones AFÍLIATE / APÚNTATE */
    .accion {
      background-color: #40E0D0; /* azul turquesa */
      color: #FFD700;             /* texto dorado */
      font-weight: bold;
      padding: 10px 20px;
      border-radius: 5px;
      cursor: pointer;
      transition: 0.3s;
      text-decoration: none;
      display: inline-block;
    }

    .accion:hover {
      background-color: #00bfa5;  /* azul más oscuro al pasar mouse */
      color: white;
      transform: scale(1.05);     /* ligero agrandamiento */
    }
  </style>
</head>
<body>

  <div class="header">
    <a href="https://docs.google.com/forms/d/e/1FAIpQLSdUUlyGWuYZPa2pMZ14zjhJemm8OTxrSNIYTwaVLFqknzYCYg/viewform?usp=header" 
       target="_blank" class="accion">
      AFÍLIATE / APÚNTATE
    </a>

    <a href="https://docs.google.com/forms/d/e/1FAIpQLSdUUlyGWuYZPa2pMZ14zjhJemm8OTxrSNIYTwaVLFqknzYCYg/viewform?usp=header" 
       target="_blank" class="accion">
      APÚNTATE AHORA
    </a>
  </div>

</body>
</html>
